[project]
name = "oop"
version = "0.1.0"
description = ""
authors = [
    {name = "'AlexSavchuk'",email = "'saaliv18@mail.ru'"}
]
requires-python = "^3.14"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.5.0,<8.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
lint = [
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]
[tool.mypy]
python_version = "3.14"
warn_return_any = true
exclude = "venv"
explicit_package_bases = true

[tool.black]
line-length = 119

[tool.isort]
profile = "black"
line_length = 119